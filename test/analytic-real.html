<!doctype html><meta charset="utf-8"><title>Analytic Flow real-GPU check</title>
<style>body{max-width:960px;margin:40px auto;font:16px system-ui;padding:16px}pre{white-space:pre-wrap;background:#eee;padding:16px}</style>
<h1>Analytic Flow · real GPU smoke + conformance</h1>
<p>Drives the shipped FiAnalytic runtime (8 shaders, full graph) on this browser's WebGL2 stack with synthetic band-limited frames and checks flow, reconstruction and cut detection against CPU ground truth. Dev-only; not packaged.</p>
<button id="run">Run analytic real-GPU test</button>
<pre id="log">idle</pre>
<script src="../fi-analytic.js"></script>
<script>
'use strict';
const log=document.getElementById('log'),button=document.getElementById('run');
const W=640,H=360;
function patternAt(x,y,ox,oy,seed){ // band-limited, exact at any subpixel offset
 let v=0.5;
 v+=.22*Math.sin((x-ox)*2*Math.PI/96+(y-oy)*2*Math.PI/151+seed);
 v+=.16*Math.sin((x-ox)*2*Math.PI/173-(y-oy)*2*Math.PI/67+seed*2.7);
 v+=.09*Math.sin(((x-ox)+(y-oy))*2*Math.PI/59+seed*1.3);
 v+=.05*Math.sin(((x-ox)-(y-oy))*2*Math.PI/37+seed*4.1);
 const r=Math.min(1,Math.max(0,v));
 return [r,Math.min(1,Math.max(0,.5+.3*Math.sin((x-ox)*2*Math.PI/83+(y-oy)*2*Math.PI/127+seed))),Math.min(1,Math.max(0,.5+.25*Math.sin((x-ox)*2*Math.PI/211-(y-oy)*2*Math.PI/47+seed*3.3)))];
}
function frame(ox,oy,seed){const d=new Uint8Array(W*H*4);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=patternAt(x,y,ox,oy,seed),i=(y*W+x)*4;d[i]=p[0]*255;d[i+1]=p[1]*255;d[i+2]=p[2]*255;d[i+3]=255;}return d;}
function noiseFrame(seed){let s=seed>>>0;const nxt=()=>((s=(s*1664525+1013904223)>>>0)/4294967296);const d=new Uint8Array(W*H*4);for(let i=0;i<W*H*4;i+=4){d[i]=nxt()*255;d[i+1]=nxt()*255;d[i+2]=nxt()*255;d[i+3]=255;}return d;}
function mae(a,b){let s=0,n=0;for(let i=0;i<a.length;i+=4){s+=(Math.abs(a[i]-b[i])+Math.abs(a[i+1]-b[i+1])+Math.abs(a[i+2]-b[i+2]))/3;n++;}return s/n/255;}
button.onclick=async()=>{
 button.disabled=true;log.textContent='running…';
 const write=v=>log.textContent=v+'\n';
 const report={kind:'analytic-real-gpu',userAgent:navigator.userAgent,cases:[],errors:[]};
 try{
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const gl=canvas.getContext('webgl2',{antialias:false,preserveDrawingBuffer:false});
  if(!gl)throw new Error('WebGL2 unavailable');
  if(!gl.getExtension('EXT_color_buffer_float'))throw new Error('EXT_color_buffer_float unavailable');
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
  report.renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'hidden';
  const tex=data=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
   for(const k of[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.LINEAR);
   for(const k of[gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T])gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE);
   gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,data);return t;};
  const fbo=gl.createFramebuffer();
  const readTex=(t,w,h,float)=>{gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
   if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('readback FBO incomplete');
   if(float){const v=new Float32Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.FLOAT,v);return v;}
   const v=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,v);return v;};
  const outTex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,outTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);

  const rt=await FiAnalytic.create(gl,W,H,'balanced');
  write('runtime created: field '+rt.dimensions.width+'x'+rt.dimensions.height+', programs '+rt.programs.size+', scratch '+(rt.stats.memoryBytes/1024|0)+' KB');

  const scenarios=[
   {name:'pan(+21,+9)@0.5',prev:frame(0,0,3.1),curr:frame(21,9,3.1),gt:frame(10.5,4.5,3.1),expectFlow:[10.5,4.5],expectCut:false},
   {name:'static@0.5',prev:frame(0,0,7.7),curr:frame(0,0,7.7),gt:frame(0,0,7.7),expectFlow:[0,0],expectCut:false},
   {name:'cut(noiseA→noiseB)@0.5',prev:noiseFrame(11),curr:noiseFrame(97),gt:null,expectFlow:null,expectCut:true},
  ];
  const fw=rt.dimensions.width,fh=rt.dimensions.height;
  for(const s of scenarios){
   if(gl.getError()!==gl.NO_ERROR)report.errors.push(s.name+': stale GL error before case');
   const prev=tex(s.prev),curr=tex(s.curr);
   const est=await rt.estimate(prev,curr,42);
   let rendered=rt.render(prev,curr,outTex,W,H,0.5,0);
   const flow=readTex(rt.tex('forward'),fw,fh,true);
   let fx=0,fy=0,conf=0,n=0;const mx=fw*.12,my=fh*.12;
   for(let y=my|0;y<fh-my;y++)for(let x=mx|0;x<fw-mx;x++){const i=(y*fw+x)*4;fx+=flow[i];fy+=flow[i+1];conf+=flow[i+2];n++;}
   fx/=n;fy/=n;conf/=n;
   let row={name:s.name,valid:est.valid,sceneCut:est.sceneCut,estMs:+est.elapsedMs.toFixed(2),confidence:+conf.toFixed(3),meanFlow:[+fx.toFixed(2),+fy.toFixed(2)],glError:gl.getError()!==gl.NO_ERROR,rendered};
   if(s.expectFlow){row.flowError=+Math.hypot(fx-s.expectFlow[0],fy-s.expectFlow[1]).toFixed(2);
    row.pass_flow=row.flowError<=1.0&&Math.abs(conf)>0;}
   if(s.gt&&rendered){const img=readTex(outTex,W,H,false);
    let blend=new Uint8Array(W*H*4);for(let i=0;i<blend.length;i++)blend[i]=(s.prev[i]+s.curr[i])/2|0;
    row.maeSynth=+mae(img,s.gt).toFixed(4);row.maeBlend=+mae(blend,s.gt).toFixed(4);
    row.pass_image=row.maeSynth<=Math.max(.001,row.maeBlend*.6);}
   row.pass_cut=s.expectCut?(est.sceneCut||conf<.1&&Math.hypot(fx,fy)<1):!est.sceneCut;
   row.passed=est.valid&&row.glError===false&&rendered&&(row.pass_flow!==false)&&(row.pass_image!==false)&&row.pass_cut;
   report.cases.push(row);write(JSON.stringify(row));
   for(const d of[1,2,3,4]){rt.render(prev,curr,outTex,W,H,0.5,d);}
   if(gl.getError()!==gl.NO_ERROR)report.errors.push(s.name+': GL error after debug renders');
   gl.deleteTexture(prev);gl.deleteTexture(curr);rt.reset();
  }
  // timing: repeated estimation of the pan pair on the real GPU
  const prev=tex(scenarios[0].prev),curr=tex(scenarios[0].curr),times=[];
  for(let i=0;i<15;i++){const t0=performance.now();await rt.estimate(prev,curr,i);times.push(performance.now()-t0);}
  times.sort((a,b)=>a-b);
  report.timing={field:[fw,fh],medianMs:+times[7].toFixed(2),minMs:+times[0].toFixed(2),maxMs:+times[14].toFixed(2)};
  write('timing: '+JSON.stringify(report.timing));
  rt.destroy();gl.deleteTexture(prev);gl.deleteTexture(curr);gl.deleteTexture(outTex);gl.deleteFramebuffer(fbo);
  report.passed=report.cases.every(c=>c.passed)&&report.errors.length===0;
  write(report.passed?'PASS: analytic graph runs on real GPU and matches ground truth':'FAIL: see rows above');
 }catch(error){report.passed=false;report.errors.push(String(error.message||error));write('FAIL: '+(error.message||error));}
 finally{window.__analyticReal=report;button.disabled=false;}
};
</script>
